# Миньон — обвязка одного media-center: сигналинг и работа с диском.
# Сам media-center работает на хосте (не в докере) и слушает REST на 7777 —
# по этому порту мастер находит устройство и читает /system/info.
#
# Набор модулей задаётся при запуске media-center:
#   ./media-center --modules=birdview,neural ...   # 360 + нейронки
#   ./media-center ...                             # чистый NVR

version: '3.8'

# Имя проекта задано явно: иначе оно берётся из имени каталога, и та же
# команда из другого места создаёт второй проект, а фиксированные
# container_name уже заняты — compose падает на конфликте имён
name: varan-minion

services:
  # ========== Signaling Server (WebSocket для WebRTC) ==========
  signaling-server:
    image: varan/signaling-server:${TAG:-latest}
    build:
      context: ./media-center/server
      dockerfile: Dockerfile
    container_name: signaling-server
    network_mode: host
    restart: unless-stopped
    # HTTP-эндпоинта у брокера нет, проверяется приём TCP на порту WebSocket.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Работа с диском и записями ==========
  storage-service:
    image: varan/storage-service:${TAG:-latest}
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: storage-service
    network_mode: host
    # root и монтирование всего /storage, чтобы сервис имел полные права
    # на чтение, запись и удаление по любому пути записей под /storage.
    user: "0:0"
    environment:
      - RECORDS_PATH=/storage/internal
      - MAX_USED_PERCENT=90
      - CLEANUP_INTERVAL_SEC=60
      - CLEANUP_TARGET_RATIO=0.9
    volumes:
      - /storage:/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
