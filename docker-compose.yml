version: '3.8'

services:
  # ========== Signaling Server (WebSocket для WebRTC) ==========
  signaling-server:
    build:
      context: ./media-center/server
      dockerfile: Dockerfile
    container_name: signaling-server
    ports:
      - "8765:8765"  # ← Явный проброс порта
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # ========== FastAPI (Управление через REST) ==========
  fastapi:
    build:
      context: ./shit/backend
      dockerfile: Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"  # ← Явный проброс порта
    environment:
      - MEDIA_CENTER_URL=http://192.168.1.2:7777  # ⚠️ Может не работать из контейнера
    restart: unless-stopped
    volumes:
      - /home/orangepi/records:/home/orangepi/records:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # ========== React Frontend ==========
  frontend:
    build:
      context: ./shit/frontend
      dockerfile: Dockerfile
      args:
        VITE_SIGNALING_SERVER: ws://192.168.1.2:8765
        VITE_FASTAPI_BASE: http://192.168.1.2:8000
    container_name: frontend
    ports:
      - "5173:80"  # ← Nginx внутри контейнера на 80
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge