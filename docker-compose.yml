version: '3.8'

services:
  # ========== Signaling Server (WebSocket для WebRTC) ==========
  signaling-server:
    build:
      context: ./media-center/server
      dockerfile: Dockerfile
    container_name: signaling-server
    network_mode: host  # Используем host network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== FastAPI (Управление через REST) ==========
  fastapi:
    build:
      context: ./shit/backend
      dockerfile: Dockerfile
    container_name: fastapi
    network_mode: host  # Используем host network
    environment:
      - MEDIA_CENTER_URL=http://localhost:7777  # Media Center на хосте
    restart: unless-stopped
    volumes:
      - /home/orangepi/varan/records:/home/orangepi/varan/records:ro
      - /storage/internal:/storage/internal:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Работа с диском и записями ==========
  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: storage-service
    network_mode: host
    # root и монтирование всего /storage, чтобы сервис имел полные права
    # на чтение, запись и удаление по любому пути записей под /storage.
    user: "0:0"
    environment:
      - RECORDS_PATH=/storage/internal
      - MAX_USED_PERCENT=90
      - CLEANUP_INTERVAL_SEC=60
      - CLEANUP_TARGET_RATIO=0.9
    volumes:
      - /storage:/storage
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Camera Scanner (ONVIF WS-Discovery) ==========
  camera-scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    container_name: camera-scanner
    network_mode: host  # обязательно для multicast WS-Discovery
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Message Gateway (CAN/WebSocket/Modbus шлюз) ==========
  message-gateway:
    build:
      context: ./message-gateway
      dockerfile: Dockerfile
    container_name: message-gateway
    # host — это ещё и доступ к CAN-интерфейсам хоста (can0): сетевые namespace
    # общие, поэтому SocketCAN работает без дополнительных прав.
    network_mode: host  # REST 9090 и gRPC 50051 на localhost + сеть КАУС
    command: [
      "--rest-port", "9090", "--grpc-port", "50051", "--heartbeat", "5",
      # Шина: интерфейс поднимается на хосте заранее,
      # ip link set can0 up type can bitrate 250000
      "--can-mode", "socketcan", "--can-iface", "can0",
      "--can-src", "0x71",   # адрес технического зрения
      "--can-peer", "0x61",  # адрес источника времени и GPS
      # Файл настроек на томе: таблица соответствий, настройки сообщений и
      # подключений сохраняются здесь и переживают пересоздание контейнера.
      # Флаги выше берутся только при первом запуске, дальше побеждает файл.
      "--state-file", "/data/gateway-state.json",
    ]
    # privileged + монтаж /dev целиком, а не перечисление конкретных устройств
    # через devices: тот список проверяется при старте, и контейнер не поднялся
    # бы, пока адаптер не воткнут. Сервис обязан стартовать на машине без железа
    # и подхватывать адаптер по факту появления, поэтому даём ему видеть все
    # can*/vcan* и все ttyUSB*/ttyACM*, включая воткнутые после запуска.
    privileged: true
    volumes:
      - /dev:/dev
      # Настройки шлюза переживают пересоздание контейнера.
      - message-gateway-data:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== React Frontend ==========
  frontend:
    build:
      context: ./shit/frontend
      dockerfile: Dockerfile
    container_name: frontend
    network_mode: host
    restart: unless-stopped

volumes:
  # Настройки message-gateway (таблица соответствий, сообщения, подключения).
  message-gateway-data:
