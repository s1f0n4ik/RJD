version: '3.8'

services:
  # ========== Signaling Server (WebSocket для WebRTC) ==========
  signaling-server:
    build:
      context: ./media-center/server
      dockerfile: Dockerfile
    container_name: signaling-server
    network_mode: host  # Используем host network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== FastAPI (Управление через REST) ==========
  fastapi:
    build:
      context: ./shit/backend
      dockerfile: Dockerfile
    container_name: fastapi
    network_mode: host  # Используем host network
    environment:
      - MEDIA_CENTER_URL=http://localhost:7777  # Media Center на хосте
    restart: unless-stopped
    volumes:
      - /home/orangepi/varan/records:/home/orangepi/varan/records:ro
      - /storage/internal:/storage/internal:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Работа с диском и записями ==========
  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: storage-service
    network_mode: host
    environment:
      - RECORDS_PATH=/storage/internal
      - MAX_STORAGE_GB=100
      - CLEANUP_INTERVAL_SEC=60
      - CLEANUP_TARGET_RATIO=0.9
    volumes:
      - /storage/internal:/storage/internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== React Frontend ==========
  frontend:
    build:
      context: ./shit/frontend
      dockerfile: Dockerfile
    container_name: frontend
    network_mode: host
    restart: unless-stopped
