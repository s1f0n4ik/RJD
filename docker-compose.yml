version: '3.8'

services:
  media-center:
    build:
      context: ./media-center
      dockerfile: Dockerfile
    container_name: vanya-media-center
    restart: unless-stopped
    volumes:
      - /opt/gstreamer-1.28:/opt/gstreamer-1.28:ro
      - ./media-center/config:/app/config
      - ./media-center/recordings:/app/recordings
    environment:
      - GST_PLUGIN_PATH=/opt/gstreamer-1.28/lib/aarch64-linux-gnu/gstreamer-1.0
      - LD_LIBRARY_PATH=/opt/gstreamer-1.28/lib/aarch64-linux-gnu:/opt/gstreamer-1.28/lib
      - PATH=/opt/gstreamer-1.28/bin:$PATH
    ports:
      - "8888:8888"  # REST API C++
    networks:
      - vanya-network

  signaling-server:
    build:
      context: ./signaling-server
      dockerfile: Dockerfile
    container_name: vanya-signaling
    restart: unless-stopped
    ports:
      - "8765:8765"
    networks:
      - vanya-network

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: vanya-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MEDIA_CENTER_URL=http://media-center:8888
    depends_on:
      - media-center
    networks:
      - vanya-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vanya-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - fastapi
    networks:
      - vanya-network

networks:
  vanya-network:
    driver: bridge