<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Camera Viewer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111;
            color: white;
        }

        .panel {
            background: #222;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .block {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        #status {
            padding: 4px 10px;
            border-radius: 6px;
            background: #444;
            min-width: 140px;
            text-align: center;
        }

        #status.connected { background: #1f7a1f; }
        #status.disconnected { background: #7a1f1f; }
        #status.connecting { background: #7a6a1f; }

        #viewer {
            width: 900px;
            height: 600px;
            margin: 20px auto;
            border: 2px solid #444;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            overflow: hidden;
        }

        img {
            max-width: 100%;
            max-height: 100%;
        }

        input, button {
            padding: 6px;
        }

        #container {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

<div class="panel">

    <!-- ROW 1: WS -->
    <div class="row">
        <div class="block">
            <input id="wsUrl"
                   placeholder="ws://192.168.1.254:8765/cal-client/server"
                   value="ws://192.168.1.254:8765/cal-client/server"/>

            <button onclick="connectWS()">Подключиться WS</button>
            <button onclick="disconnectWS()">Отключить WS</button>

            <div id="status" class="disconnected">DISCONNECTED</div>
        </div>
    </div>

    <!-- ROW 2: CALIBRATION -->
    <div class="row">
        <div class="block">

            <input id="cameraId" placeholder="camera_id" />
            <input id="width" placeholder="width" type="number" />
            <input id="height" placeholder="height" type="number" />

            <button onclick="startCalibration()">Начать калибровку</button>
        </div>
    </div>

</div>

<div id="container">
    <div id="viewer">
        <img id="image"/>
    </div>
</div>

<script>
    let socket = null;
    let clientId = "web_client_" + Math.random().toString(16).slice(2);

    const statusEl = document.getElementById("status");

    function setStatus(state) {
        statusEl.className = state;
        statusEl.textContent = state.toUpperCase();
    }

    // ---------------- WS ----------------

    function getWsUrl() {
        return document.getElementById("wsUrl").value.trim();
    }

    function connectWS() {
        const url = getWsUrl();

        if (!url) return;

        if (socket && socket.readyState === WebSocket.OPEN) {
            return;
        }

        setStatus("connecting");

        socket = new WebSocket(url);
        socket.binaryType = "arraybuffer";

        socket.onopen = () => setStatus("connected");
        socket.onclose = () => setStatus("disconnected");
        socket.onerror = () => setStatus("disconnected");

        socket.onmessage = (e) => handleMessage(e.data);
    }

    function disconnectWS() {
        if (socket) socket.close();
        socket = null;
        setStatus("disconnected");
    }

    function send(msg) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(msg);
    }

    // ---------------- CALIBRATION ----------------

    function startCalibration() {
        const camera_id = document.getElementById("cameraId").value;
        const width = parseInt(document.getElementById("width").value);
        const height = parseInt(document.getElementById("height").value);

        send(JSON.stringify({
            type: "connection",
            client_id: clientId,
            meta: {
                camera_id,
                width,
                height,
                fps: 15
            }
        }));
    }

    // ---------------- MESSAGES ----------------

    function handleMessage(data) {

        if (typeof data === "string") {
            try {
                console.log("JSON:", JSON.parse(data));
            } catch {}
            return;
        }

        const view = new DataView(data);

        const jsonSize =
            (view.getUint8(0) << 24) |
            (view.getUint8(1) << 16) |
            (view.getUint8(2) << 8) |
            (view.getUint8(3));

        const jsonBytes = new Uint8Array(data, 4, jsonSize);
        const imageBytes = new Uint8Array(data, 4 + jsonSize);

        try {
            const meta = JSON.parse(new TextDecoder().decode(jsonBytes));
            console.log("Meta:", meta);
        } catch {}

        renderImage(imageBytes);
    }

    let lastUrl = null;

    function renderImage(bytes) {
        const blob = new Blob([bytes], { type: "image/jpeg" });
        const url = URL.createObjectURL(blob);

        const img = document.getElementById("image");
        img.src = url;

        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = url;
    }

</script>

</body>
</html>
