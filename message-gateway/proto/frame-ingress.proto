syntax = "proto3";

package varan.gateway.rpc;

// Высокочастотный ingress кадров: media-center отдаёт семантику кадра, шлюз
// кодирует под протокол и шлёт в транспорт. gRPC вместо HTTP POST, т.к. кадры
// с изображением идут часто и тяжёлые.
service FrameIngress {
    // Мастер обнаружений шлёт события обнаружений, подтверждение на каждое сообщение
    rpc StreamFrames(stream FrameRequest) returns (stream FrameReply);

    // Одиночная отправка для редких/простых вызовов.
    rpc SendFrame(FrameRequest) returns (FrameReply);

    // Точное время + GPS шлюза. media-center опрашивает раз в 10с и
    // синхронизирует по этому значению свои локальные часы.
    rpc GetTime(TimeRequest) returns (TimeReply);
}

// Событие трека, на котором мастер записал обнаружение; номера как в detection-ingress.proto
enum TrackEvent {
    TRACK_EVENT_UNSPECIFIED = 0;
    TRACK_EVENT_CREATED = 1;
    TRACK_EVENT_CONFIRMED = 2;
    TRACK_EVENT_UPDATED = 3;
    TRACK_EVENT_LOST = 4;
    TRACK_EVENT_RECOVERED = 5;
    TRACK_EVENT_REMOVED = 6;
}

message Detection {
    int32 cid = 1;            // числовой id класса
    string cls = 2;           // имя класса
    double cf = 3;            // confidence 0..1
    repeated int32 box = 4;   // x, y, w, h
    string scls = 5;          // подкатегория (info/warning/danger), опционально
    uint64 detection_id = 6;  // ID обнаружения у мастера, наружу не уходит
    int32 type = 7;           // тип обнаружения CAN по таблице соответствий мастера, 0 — пусто
    int32 danger = 8;         // класс опасности CAN по таблице соответствий мастера, 0 — пусто
}

// Запись обнаружения для АС КРСПС по Modbus; поля считает мастер по правилам конфигурации
message Record {
    int32 code = 1;           // код обнаружения
    uint32 frame_id = 2;      // ID стоп-кадра: номер обнаружения в журнале
    int32 camera_mask = 3;    // камеры с фиксацией, бит 1 — младший
    int32 zone = 4;           // зона обнаружения, 0 — пусто
    int32 count = 5;          // количество объектов
    int64 ts = 6;             // время, unix мс в поясе шлюза; 0 — время приёма
    GpsData gps = 7;          // координаты; без valid шлюз ставит свои
}

message FrameRequest {
    int32 ver = 1;            // версия протокола, запрошенная клиентом
    int64 id = 2;             // номер сообщения в сессии мастера
    int64 ts = 3;
    int32 width = 4;
    int32 height = 5;
    string format = 6;        // jpeg / png / webp
    repeated Detection dets = 7;
    bytes image = 8;          // сырые байты изображения
    string camera_id = 9;     // идентификатор камеры-источника
    string config_id = 10;    // конфигурация нейросети, которой получены обнаружения
    int64 session = 11;       // время запуска мастера, unix мс
    TrackEvent event = 12;    // одно на сообщение; шлюз разбирает CONFIRMED и REMOVED, прочие пропускает
    Record record = 13;       // запись для Modbus; шлюз Искры пишет запись только из сообщений с ней
    repeated string modules = 14; // id модулей-получателей; пусто — все модули активной конфигурации
    int32 camera_no = 15;     // номер камеры CAN по таблице соответствий мастера, 0 — камеры в таблице нет
}

message FrameReply {
    bool accepted = 1;
    string error = 2;
    int32 ver = 3;
    string transport = 4;
    int64 wire_size = 5;
    int64 id = 6;             // номер запроса, на который ответ
}

message GpsData {
    double lat = 1;
    double lon = 2;
    double alt = 3;
    bool valid = 4;
    int32 sats = 5;
    double speed = 6;    // м/с
    double course = 7;   // градусы
}

message TimeRequest {
}

message TimeReply {
    // Уже сдвинуто на настроенный в шлюзе пояс — использовать как есть
    int64 unix_ms = 1;
    GpsData gps = 2;
    int32 tz_offset_min = 3;
    // Время получено с шины. false — тикают часы шлюза, доверять нельзя
    bool can_time = 4;
}
