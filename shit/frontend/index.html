<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <style>
      /* Сплэш живёт вне #root и снимается из Bootstrap при монтировании React.
         Класс .boot тот же самый носит заглушка Suspense: между снятием сплэша
         и отрисовкой ленивого чанка экран не должен белеть. */
      #boot, .boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f5f5f5;
        font-family: system-ui, 'Segoe UI', Arial, sans-serif;
      }
      #boot[data-theme='dark'], .boot[data-theme='dark'] { background: #12141a; }
      #boot[data-theme='birdview'] { background: #121216; }
      #boot[data-theme='krsps']    { background: #f6f4f2; }
      .boot-mark {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9e9e9e;
      }
      #boot[data-theme='dark'] .boot-mark, .boot[data-theme='dark'] .boot-mark { color: #7b8698; }
      .boot-bar {
        position: relative;
        width: 170px;
        height: 2px;
        border-radius: 2px;
        background: rgba(128, 128, 128, 0.24);
        overflow: hidden;
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 2px;
        background: #e21a1a;
        animation: boot-run 1.15s ease-in-out infinite;
      }
      #boot[data-theme='dark'] .boot-bar::after, .boot[data-theme='dark'] .boot-bar::after { background: #5b9dff; }
      @keyframes boot-run {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after { animation: none; width: 100%; opacity: 0.45; }
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="boot">
      <div class="boot-mark">Видеоаналитика</div>
      <div class="boot-bar"></div>
    </div>
    <script>
      // Фон сплэша по маршруту: «/» без FULL_AUTH уходит в киоск, он тёмный
      (function () {
        var p = window.location.pathname;
        var theme = 'light';
        if (p.indexOf('/app/birdview') === 0) theme = 'birdview';
        else if (p.indexOf('/app/krsps') === 0) theme = 'krsps';
        else if (p.indexOf('/new') === 0 || p.indexOf('/app/neural') === 0 || p.indexOf('/translation') === 0 || p.indexOf('/kiosk') === 0 || p === '/') theme = 'dark';
        document.getElementById('boot').setAttribute('data-theme', theme);
        // Фон страницы под сплэшем: иначе между его снятием и первой отрисовкой мелькает белое
        document.body.style.background =
          theme === 'dark' ? '#12141a' : theme === 'birdview' ? '#121216' : theme === 'krsps' ? '#f6f4f2' : '#f5f5f5';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
