<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <style>
      /* Сплэш живёт вне #root и снимается из Bootstrap при монтировании React.
         Класс .boot тот же самый носит заглушка Suspense: между снятием сплэша
         и отрисовкой ленивого чанка экран не должен белеть. */
      #boot, .boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #12141a;
        font-family: system-ui, 'Segoe UI', Arial, sans-serif;
      }
      .boot-mark {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7b8698;
      }
      .boot-bar {
        position: relative;
        width: 170px;
        height: 2px;
        border-radius: 2px;
        background: rgba(128, 128, 128, 0.24);
        overflow: hidden;
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 2px;
        background: #5b9dff;
        animation: boot-run 1.15s ease-in-out infinite;
      }
      @keyframes boot-run {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after { animation: none; width: 100%; opacity: 0.45; }
      }
    </style>
  </head>
  <!-- Фон под сплэшем: иначе между его снятием и первой отрисовкой мелькает белое -->
  <body class="ui-new" style="margin: 0; background: #12141a">
    <div id="boot">
      <div class="boot-mark">Видеоаналитика</div>
      <div class="boot-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
