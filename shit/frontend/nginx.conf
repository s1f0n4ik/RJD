upstream backend {
    server 127.0.0.1:8000;       # FastAPI (auth, recordings, neural, ws)
    keepalive 32;
}

upstream media_center {
    server 127.0.0.1:7777;       # C++ REST для камер
    keepalive 32;
}

upstream signaling {
    server 127.0.0.1:8765;       # WebRTC signaling
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # ── Статика SPA ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth → FastAPI ──
    location /auth/ {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
    }

    # GET /api/cameras  →  GET /camera
    location = /api/cameras {
        include snippets/proxy-common.conf;
        rewrite ^ /camera break;
        proxy_pass http://media_center;
    }

    # POST /api/camera  →  POST /camera
    location = /api/camera {
        include snippets/proxy-common.conf;
        rewrite ^ /camera break;
        proxy_pass http://media_center;
    }

    # GET/PATCH/DELETE /api/camera/{id}  →  /camera?id={id}
    location ~ ^/api/camera/(.+)$ {
        include snippets/proxy-common.conf;
        rewrite ^/api/camera/(.+)$ /camera?id=$1 break;
        proxy_pass http://media_center;
    }

    # ── Linker REST API → media_center ──
    location /linker/ {
        include snippets/proxy-common.conf;
        # /linker/foo/bar -> /linker/foo/bar
        proxy_pass http://media_center;
    }

    # ── Остальной API (recordings и т.п.) → FastAPI ──
    location /api/ {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
    }

    # ── WebSocket → FastAPI ──
    location = /ws {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── WebRTC signaling → отдельный сервис ──
    location /signaling/ {
        include snippets/proxy-common.conf;
        # /signaling/client/cam_1 → /client/cam_1
        rewrite ^/signaling/(.*)$ /$1 break;
        proxy_pass http://signaling;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}