upstream backend {
    server 127.0.0.1:8000;       # FastAPI (auth, neural, ws)
    keepalive 32;
}

upstream media_center {
    server 127.0.0.1:7777;       # C++ REST для камер
    keepalive 32;
}

upstream signaling {
    server 127.0.0.1:8765;       # WebRTC signaling
    keepalive 32;
}

upstream storage_service {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream camera_scanner {
    server 127.0.0.1:8002;
    keepalive 32;
}

upstream message_gateway {
    server 127.0.0.1:9090;       # шлюз обмена сообщениями (CAN/WS/Modbus)
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # ── Статика SPA ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth → FastAPI ──
    location /auth/ {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
    }

    # ── Camera Scanner → отдельный сервис ──
    location /api/scan {
        include snippets/proxy-common.conf;
        rewrite ^/api/scan(.*)$ /scan$1 break;
        proxy_pass http://camera_scanner;
        proxy_read_timeout 60s;

        # Для SSE-стрима — отключаем буферизацию
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # GET /api/cameras  →  GET /camera
    location = /api/cameras {
        include snippets/proxy-common.conf;
        rewrite ^ /camera break;
        proxy_pass http://media_center;
    }

    # GET /api/streams  →  GET /streams
    # Виртуальные потоки приезжают и вместе с /api/cameras; отдельная ручка
    # нужна тем, кому список камер не требуется
    location = /api/streams {
        include snippets/proxy-common.conf;
        rewrite ^ /streams break;
        proxy_pass http://media_center;
    }

    # POST /api/camera  →  POST /camera
    location = /api/camera {
        include snippets/proxy-common.conf;
        rewrite ^ /camera break;
        proxy_pass http://media_center;
    }

    # GET/PATCH/DELETE /api/camera/{id}  →  /camera?id={id}
    location ~ ^/api/camera/(.+)$ {
        include snippets/proxy-common.conf;
        rewrite ^/api/camera/(.+)$ /camera?id=$1 break;
        proxy_pass http://media_center;
    }

    # ── Linker REST API → media_center ──
    location /linker/ {
        include snippets/proxy-common.conf;
        # /linker/foo/bar -> /linker/foo/bar
        proxy_pass http://media_center;
    }

    # ── Nueral REST API → media_center ──
    location /neural/ {
        include snippets/proxy-common.conf;
        # /linker/foo/bar -> /linker/foo/bar
        proxy_pass http://media_center;
    }

    # --- API для работы с диском
    location /api/recordings {
        include snippets/proxy-common.conf;
        proxy_pass http://storage_service;
        # для длинных операций склейки увеличиваем таймаут
        proxy_read_timeout 600s;
    }

    location ~ ^/api/recordings/jobs/[^/]+/progress$ {
        include snippets/proxy-common.conf;
        proxy_pass http://storage_service;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── Журнал обнаружений → storage_service (та же служба, что записи) ──
    # Список/деталь/вердикты + кадры JPEG + offline-тайлы карты (.mbtiles).
    location /api/journal {
        include snippets/proxy-common.conf;
        proxy_pass http://storage_service;
    }

    # ── Message Gateway: только настроечные REST-ручки → message_gateway ──
    # ingress кадров идёт по gRPC (localhost:50051) от media-center напрямую,
    # наружу через nginx не публикуется.
    location /api/gateway/ {
        include snippets/proxy-common.conf;
        # /api/gateway/config → /config, /api/gateway/ws/status → /ws/status
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass http://message_gateway;
    }

    # ── Остальной API → FastAPI ──
    location /api/ {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
    }

    # ── WebSocket → FastAPI ──
    location = /ws {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── WebRTC signaling → отдельный сервис ──
    location /signaling/ {
        include snippets/proxy-common.conf;
        # /signaling/client/cam_1 → /client/cam_1
        rewrite ^/signaling/(.*)$ /$1 break;
        proxy_pass http://signaling;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}