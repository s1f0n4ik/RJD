# Мастер — чистый веб-стек: nginx знает только локальные сервисы мастера.
# Всё устройство-зависимое (media-center, storage, сигналинг) ходит через
# backend-прокси /d/{deviceId}/... и здесь больше не настраивается.

upstream backend {
    server 127.0.0.1:8000;       # FastAPI (auth, devices, прокси устройств, ws)
    keepalive 32;
}

upstream camera_scanner {
    server 127.0.0.1:8002;
    keepalive 32;
}

upstream message_gateway {
    server 127.0.0.1:9090;       # шлюз обмена сообщениями (CAN/WS/Modbus)
    keepalive 32;
}

# WebSocket и обычные запросы живут в одном location /d/
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # ── Статика SPA ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth → FastAPI ──
    location /auth/ {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
    }

    # ── Camera Scanner → отдельный сервис ──
    location /api/scan {
        include snippets/proxy-common.conf;
        rewrite ^/api/scan(.*)$ /scan$1 break;
        proxy_pass http://camera_scanner;
        proxy_read_timeout 60s;

        # Для SSE-стрима — отключаем буферизацию
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # ── Message Gateway: только настроечные REST-ручки → message_gateway ──
    # ingress кадров идёт по gRPC (localhost:50051) от media-center напрямую,
    # наружу через nginx не публикуется.
    location /api/gateway/ {
        include snippets/proxy-common.conf;
        # /api/gateway/config → /config, /api/gateway/ws/status → /ws/status
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass http://message_gateway;
    }

    # ── Прокси устройств: REST и WebSocket на media-center/storage/сигналинг ──
    # /d/{deviceId}/mc/... , /d/{deviceId}/storage/... , /d/{deviceId}/signaling/...
    location /d/ {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Склейка записей и сигналинг живут долго, ответы не буферизуем
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # ── Остальной API (devices, cameras, streams, layouts, ...) → FastAPI ──
    location /api/ {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
    }

    # ── WebSocket → FastAPI ──
    location = /ws {
        include snippets/proxy-common.conf;
        proxy_pass http://backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
