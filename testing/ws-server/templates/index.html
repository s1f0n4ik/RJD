<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ws-server: тест приёма кадров</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1b1d21; color: #e7e7e7; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #9a9ea6; font-size: 13px; margin-bottom: 20px; }
  .entry { display: flex; gap: 16px; background: #24272c; border: 1px solid #33373d; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .entry img { max-width: 320px; max-height: 240px; border-radius: 4px; background: #000; object-fit: contain; cursor: zoom-in; }
  .entry pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.4; flex: 1; }
  .meta { color: #7fd3a3; font-size: 12px; margin-bottom: 6px; }
  .kind-text .meta { color: #e2b563; }
  .placeholder { width: 320px; height: 240px; display: flex; align-items: center; justify-content: center; background: #16181b; border-radius: 4px; color: #666; font-size: 12px; flex: none; }
  .empty { color: #666; }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    z-index: 100;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
</style>
</head>
<body>
  <h1>ws-server — приём кадров по протоколу СВН ↔ КАУС</h1>
  <div class="sub" id="sub">ws://&lt;host&gt;:8765/ws/frames — последние 0 / 10 сообщений</div>
  <div id="list"></div>

  <div id="lightbox">
    <img id="lightbox-img" src="" alt="full frame">
  </div>

<script>
const listEl = document.getElementById('list');
const subEl = document.getElementById('sub');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function render(entries) {
  subEl.textContent = `ws://<host>:8765/ws/frames — последние ${entries.length} / 10 сообщений`;

  if (entries.length === 0) {
    listEl.innerHTML = '<div class="empty">Сообщений пока нет — ждём подключения клиента.</div>';
    return;
  }

  listEl.innerHTML = entries.map(e => {
    const media = e.image_data_url
      ? `<img src="${e.image_data_url}" alt="frame" data-full="${e.image_data_url}">`
      : '<div class="placeholder">без изображения</div>';
    const sizeInfo = e.image_size ? ` — ${e.image_size} байт` : '';
    return `
      <div class="entry kind-${e.kind}">
        ${media}
        <div>
          <div class="meta">${e.received_at} — ${e.kind}${sizeInfo}</div>
          <pre>${escapeHtml(e.header)}</pre>
        </div>
      </div>`;
  }).join('');

  listEl.querySelectorAll('img[data-full]').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.dataset.full));
  });
}

async function poll() {
  try {
    const res = await fetch('/messages');
    const data = await res.json();
    render(data.entries);
  } catch (e) {
    console.error('poll failed', e);
  } finally {
    setTimeout(poll, 1000);
  }
}

poll();
</script>
</body>
</html>
